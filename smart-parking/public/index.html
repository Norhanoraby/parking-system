<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Parking</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        h2 { font-size: 1.5rem; color: #00ff88; font-weight: normal; }
        .spinner { margin-top: 30px; border: 4px solid rgba(255,255,255,0.1); border-left-color: #00ff88; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>Welcome to Smart Parking</h1>
    <h2>Please scan your RFID card at the scanner...</h2>
    <div class="spinner"></div>

    <script>
        // Check the server every 1 second
        setInterval(async () => {
            try {
                const res = await fetch('/api/kiosk-status');
                const data = await res.json();

                if (data.role === 'admin') {
                    window.location.href = 'admin.html';
                } else if (data.role === 'user') {
                    // Save the receipt data to localStorage so the user page can read it
                    localStorage.setItem('kioskData', JSON.stringify(data));
                    window.location.href = 'user.html';
                }
            } catch (err) {
                console.error("Waiting for server...");
            }
        }, 1000);
    </script>
</body>
</html>
