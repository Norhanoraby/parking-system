<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header-row { display: flex; justify-content: space-between; align-items: center; }
        button { background: #dc3545; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #343a40; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h2>Admin Log Manager</h2>
            <button onclick="window.location.href='index.html'">Lock System (Return to Scanner)</button>
        </div>
        <table>
            <thead><tr><th>Driver</th><th>Entry</th><th>Exit</th><th>Status</th><th>Fee</th><th>Penalty</th></tr></thead>
            <tbody id="logsTable"></tbody>
        </table>
    </div>

    <script>
        async function fetchLogs() {
            const res = await fetch('/api/logs');
            const data = await res.json();
            document.getElementById('logsTable').innerHTML = data.map(log => `
                <tr>
                    <td><b>${log.driverAlias}</b></td>
                    <td>${new Date(log.entryTime).toLocaleString()}</td>
                    <td>${log.exitTime ? new Date(log.exitTime).toLocaleString() : '-'}</td>
                    <td>${log.status}</td>
                    <td>${log.fee}</td>
                    <td style="color:red;">${log.penalty > 0 ? log.penalty : 0}</td>
                </tr>
            `).join('');
        }
        fetchLogs();
        setInterval(fetchLogs, 3000); 
    </script>
</body>
</html>
